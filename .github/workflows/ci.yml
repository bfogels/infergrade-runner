name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require prospective develop merge to contain released main ancestry
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor origin/main HEAD

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./python/runner-core
          python -m pip install ruff==0.15.22

      - name: Lint Python
        run: python -m ruff check python scripts

      - name: Check version declarations
        run: |
          python3 ./scripts/sync_versions.py --check
          python3 ./scripts/check_versions.py
          python3 ./scripts/check_llama_cpp_runtime_policy.py

      - name: Validate changed release version
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          if git diff --quiet origin/main...HEAD -- VERSION; then
            echo "VERSION is unchanged; this is a version-neutral source promotion."
          else
            python3 ./scripts/check_version_bump.py --base-ref origin/main
          fi

      - name: Run Python test suite
        run: ./scripts/test_all.sh

      - name: Run desktop web contract tests
        run: |
          npm --prefix apps/desktop-runner ci
          npm --prefix apps/desktop-runner run check

      - name: Capture autonomous acceptance evidence
        run: python3 scripts/run_product_acceptance.py --skip-commands

      - name: Upload autonomous acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-product-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/product-acceptance/latest.json
          if-no-files-found: error
          retention-days: 14

  rust:
    name: Rust workspace (build, test, clippy, fmt)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Update Linux package indexes
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ! sudo timeout --kill-after=15s 180s apt-get \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              update; then
            echo "Hosted mirror stalled; retrying against the official Ubuntu archive."
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu' \
                | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [ -f "$source_file" ]; then
                sudo sed -i \
                  -e 's|http://azure.archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' \
                  -e 's|https://azure.archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' \
                  "$source_file"
              fi
            done
            sudo timeout --kill-after=15s 240s apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              update
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          packages=(
            build-essential
            pkg-config
            libssl-dev
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            libsoup-3.0-dev
            libjavascriptcoregtk-4.1-dev
            libxdo-dev
          )
          install_packages() {
            local deadline_seconds="$1"
            local retries="$2"
            sudo timeout --kill-after=15s "${deadline_seconds}s" apt-get \
              -o "Acquire::Retries=${retries}" \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              install -y "${packages[@]}"
          }
          if ! install_packages 480 1; then
            echo "Hosted mirror stalled during package download; retrying against the official Ubuntu archive."
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf '%s\n' 'https://archive.ubuntu.com/ubuntu' \
                | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [ -f "$source_file" ]; then
                sudo sed -i \
                  -e 's|http://azure.archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' \
                  -e 's|https://azure.archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' \
                  "$source_file"
              fi
            done
            sudo timeout --kill-after=15s 240s apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              update
            sudo timeout --kill-after=15s 120s dpkg --configure -a
            install_packages 720 3
          fi

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo build (engine + cli + sidecar)
        run: cargo build --workspace --exclude infergrade_desktop_runner --locked

      - name: cargo test (engine + cli + sidecar)
        run: cargo test --workspace --exclude infergrade_desktop_runner --locked

      - name: Build desktop sidecar binary (needed by Tauri shell)
        run: bash ./scripts/build_desktop_sidecar.sh

      - name: cargo build (desktop shell)
        run: cargo build -p infergrade_desktop_runner --lib --locked

      - name: cargo test (desktop shell)
        run: cargo test -p infergrade_desktop_runner --lib --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  cargo-audit:
    name: cargo audit (advisory snapshot, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-audit (prebuilt)
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: cargo-audit@0.22.2

      - name: cargo audit
        # Keep the snapshot visible as a warning without making its expected
        # advisory/parser churn block the cargo-deny enforcement gate.
        continue-on-error: true
        run: cargo audit --file Cargo.lock

  cargo-deny:
    name: cargo deny (advisories + bans + licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny (prebuilt)
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: cargo-deny@0.19

      - name: cargo deny check
        run: cargo deny check --hide-inclusion-graph
