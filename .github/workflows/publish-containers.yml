name: Publish Containers

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container tag to publish
        required: false
        default: ""
      force_rebuild:
        description: Rebuild every image even when an identical one was already published
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: infergrade-runner-core
            dockerfile: containers/runner-core/Dockerfile
            platforms: linux/amd64
          - image: infergrade-llama-cpp
            dockerfile: containers/llama-cpp/Dockerfile
            platforms: linux/amd64
          - image: infergrade-ifeval
            dockerfile: containers/capability-ifeval/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: infergrade-evalplus
            dockerfile: containers/capability-evalplus/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: infergrade-mmlu-pro
            dockerfile: containers/capability-mmlu-pro/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: infergrade-gpqa
            dockerfile: containers/capability-gpqa/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: infergrade-longbench-v2
            dockerfile: containers/capability-longbench-v2/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: infergrade-bfcl
            dockerfile: containers/capability-bfcl/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: infergrade-repository-edit
            dockerfile: containers/capability-repo-edit/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: python3 ./scripts/check_release_tag.py --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --main-ref origin/main

      - name: Set image tag
        id: meta
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            image_tag="${{ github.event.inputs.image_tag }}"
            if [ -z "$image_tag" ]; then
              image_tag="$(cat VERSION)"
            fi
            echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract image metadata
        id: docker_meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.meta.outputs.image_tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Fingerprint image inputs
        id: inputs
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          # Base images are unpinned tags; fold their current manifest into the
          # fingerprint so upstream security refreshes still trigger a rebuild.
          bases=$(python3 scripts/container_input_digest.py --dockerfile "$DOCKERFILE" --platforms "$PLATFORMS" --print-base-images)
          base_state=""
          while read -r base; do
            [ -z "$base" ] && continue
            manifest_sha=$(docker buildx imagetools inspect --raw "$base" | sha256sum | cut -d' ' -f1)
            base_state="${base_state}${base}=${manifest_sha};"
          done <<< "$bases"
          fingerprint=$(python3 scripts/container_input_digest.py --dockerfile "$DOCKERFILE" --platforms "$PLATFORMS" --base-digest "$base_state" --short)
          echo "tag=inputs-${fingerprint}" >> "$GITHUB_OUTPUT"

      - name: Look for an identical published image
        id: reuse
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          INPUT_TAG: ${{ steps.inputs.outputs.tag }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
        run: |
          if [ "$FORCE_REBUILD" != "true" ] && docker buildx imagetools inspect "$IMAGE:$INPUT_TAG" >/dev/null 2>&1; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "Reusing $IMAGE:$INPUT_TAG (inputs unchanged)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Building $IMAGE (inputs changed, first publish, or forced)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Re-tag unchanged image
        if: steps.reuse.outputs.reuse == 'true'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          INPUT_TAG: ${{ steps.inputs.outputs.tag }}
          TAGS: ${{ steps.docker_meta.outputs.tags }}
        run: |
          # imagetools create copies the manifest list, so every platform keeps
          # the exact digest that was already published and verified.
          args=()
          while read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE:$INPUT_TAG"

      - name: Build and push
        if: steps.reuse.outputs.reuse != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          pull: true
          no-cache: ${{ github.event.inputs.force_rebuild == 'true' }}
          tags: |
            ${{ steps.docker_meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.inputs.outputs.tag }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
