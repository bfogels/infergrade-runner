name: Desktop Runner Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer desktop app version to publish; defaults to VERSION on main"
        default: ""
        required: false
      notes:
        description: "Short release notes shown in the updater"
        default: "InferGrade Runner desktop update."
        required: false
      publish_unsigned_windows_preview:
        description: "Publish clearly labeled unsigned Windows technical-preview installers"
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: desktop-runner-release
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Verify release identity
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      desktop-version: ${{ steps.metadata.outputs.desktop-version }}
      release-tag: ${{ steps.metadata.outputs.release-tag }}
      release-notes: ${{ steps.metadata.outputs.release-notes }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release metadata
        id: metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_NOTES: ${{ inputs.notes }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Protected desktop releases must be dispatched from main, not $GITHUB_REF."
            exit 1
          fi
          desktop_version="$REQUESTED_VERSION"
          if [ -z "$desktop_version" ]; then
            desktop_version="$(cat VERSION)"
          fi
          DESKTOP_VERSION="$desktop_version"
          source_version="$(cat VERSION)"
          if [ "$DESKTOP_VERSION" != "$source_version" ]; then
            echo "::error::Requested desktop version $DESKTOP_VERSION does not match VERSION $source_version."
            exit 1
          fi
          release_notes="$REQUESTED_NOTES"
          if [ -z "$release_notes" ]; then
            release_notes="InferGrade Runner desktop update for ${GITHUB_SHA}."
          fi
          {
            echo "desktop-version=$desktop_version"
            echo "release-tag=v$desktop_version"
            echo "release-notes<<EOF"
            echo "$release_notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release-tag }}
        run: |
          tag_commit="$(gh api "repos/${{ github.repository }}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          tag_type="$(gh api "repos/${{ github.repository }}/git/ref/tags/${RELEASE_TAG}" --jq '.object.type')"
          if [ "$tag_type" = "tag" ]; then
            tag_commit="$(gh api "repos/${{ github.repository }}/git/tags/${tag_commit}" --jq '.object.sha')"
          fi
          if [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "::error::$RELEASE_TAG resolves to $tag_commit, expected dispatched main commit $GITHUB_SHA."
            exit 1
          fi

      - name: Verify matching public runtime and capability images
        env:
          DESKTOP_VERSION: ${{ steps.metadata.outputs.desktop-version }}
        run: |
          python3 ./scripts/sync_versions.py --check
          python3 ./scripts/check_versions.py
          INFERGRADE_IMAGE_TAG="$DESKTOP_VERSION" ./scripts/verify_release_images.sh

  macos-preview:
    name: Build signed macOS desktop package
    needs: release-metadata
    runs-on: macos-latest
    timeout-minutes: 120
    environment: release
    env:
      DESKTOP_VERSION: ${{ needs.release-metadata.outputs.desktop-version }}
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release-tag }}
      RELEASE_NOTES: ${{ needs.release-metadata.outputs.release-notes }}
      PUBLIC_DMG_NAME: InferGrade.Runner.macOS-arm64.dmg
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Check desktop app dependencies
        run: ./scripts/build_desktop_runner.sh --check-only

      - name: Verify signing and notarization inputs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          missing=()
          for name in \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_TEAM_ID
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          use_api_key=0
          if [ -n "${APPLE_API_KEY:-}" ] || [ -n "${APPLE_API_ISSUER:-}" ] || [ -n "${APPLE_API_PRIVATE_KEY:-}" ]; then
            use_api_key=1
            for name in APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY; do
              if [ -z "${!name:-}" ]; then
                missing+=("$name")
              fi
            done
          elif [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_PASSWORD:-}" ]; then
            for name in APPLE_ID APPLE_PASSWORD; do
              if [ -z "${!name:-}" ]; then
                missing+=("$name")
              fi
            done
          fi
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing desktop release signing/notarization input(s): %s\n' "${missing[*]}"
            echo "The desktop release workflow publishes user-downloadable artifacts, so it must not fall back to ad-hoc signing or skip notarization."
            exit 1
          fi
          if [ "$use_api_key" -eq 1 ]; then
            echo "APPLE_NOTARIZATION_MODE=api_key" >> "$GITHUB_ENV"
          else
            echo "APPLE_NOTARIZATION_MODE=apple_id" >> "$GITHUB_ENV"
          fi

      - name: Validate Apple signing certificate password
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          cert_path="$RUNNER_TEMP/infergrade-release-certificate.p12"
          trap 'rm -f "$cert_path"' EXIT
          if ! printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert_path" 2>/dev/null; then
            printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$cert_path"
          fi
          if ! openssl pkcs12 \
            -in "$cert_path" \
            -passin env:APPLE_CERTIFICATE_PASSWORD \
            -nokeys \
            -clcerts \
            -out /dev/null >/dev/null 2>&1 && \
            ! openssl pkcs12 -legacy \
              -in "$cert_path" \
              -passin env:APPLE_CERTIFICATE_PASSWORD \
              -nokeys \
              -clcerts \
              -out /dev/null >/dev/null 2>&1; then
            echo "::error::APPLE_CERTIFICATE could not be opened with APPLE_CERTIFICATE_PASSWORD. Re-export the Developer ID Application certificate as a .p12 and update both GitHub release-environment secrets together."
            exit 1
          fi

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ "$APPLE_NOTARIZATION_MODE" != "api_key" ]; then
            exit 0
          fi
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Install Developer ID certificate for embedded runtime signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          cert_path="$RUNNER_TEMP/infergrade-release-certificate.p12"
          keychain_path="$RUNNER_TEMP/infergrade-release-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          if ! printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert_path" 2>/dev/null; then
            printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$cert_path"
          fi
          chmod 600 "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          identities="$(security find-identity -v -p codesigning "$keychain_path")"
          identity_count="$(printf '%s\n' "$identities" | awk '/"Developer ID Application:/{count++} END{print count+0}')"
          if [ "$identity_count" -ne 1 ]; then
            echo "::error::APPLE_CERTIFICATE must contain exactly one valid Developer ID Application identity; found $identity_count."
            exit 1
          fi
          signing_identity="$(printf '%s\n' "$identities" | awk '/"Developer ID Application:/{print $2; exit}')"
          if [[ ! "$signing_identity" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "::error::Could not derive the Developer ID Application fingerprint from APPLE_CERTIFICATE."
            exit 1
          fi
          rm -f "$cert_path"
          echo "INFERGRADE_RELEASE_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "INFERGRADE_MACOS_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Build signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: ./scripts/build_desktop_runner.sh --with-updater --skip-checks

      - name: Notarize macOS DMG
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: ./scripts/notarize_desktop_dmg.sh

      - name: Verify macOS signing and notarization
        run: ./scripts/verify_desktop_macos_release.sh

      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [ -n "${INFERGRADE_RELEASE_KEYCHAIN:-}" ]; then
            security delete-keychain "$INFERGRADE_RELEASE_KEYCHAIN" || true
          fi

      - name: Prepare stable public macOS assets
        run: |
          python3 ./scripts/prepare_desktop_release_dmg.py \
            --dmg-dir target/release/bundle/dmg \
            --output-name "$PUBLIC_DMG_NAME"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}"
          python3 ./scripts/write_desktop_update_manifest.py \
            --bundle-dir target/release/bundle/macos \
            --version "$DESKTOP_VERSION" \
            --base-url "$BASE_URL" \
            --notes "$RELEASE_NOTES" \
            --output target/release/bundle/macos/infergrade-runner-desktop-latest.json
          mkdir -p target/release/public-macos
          cp target/release/bundle/dmg/*.dmg target/release/public-macos/
          cp target/release/bundle/macos/*.tar.gz target/release/public-macos/
          cp target/release/bundle/macos/*.tar.gz.sig target/release/public-macos/
          cp target/release/bundle/macos/infergrade-runner-desktop-latest.json target/release/public-macos/
          python3 ./scripts/write_desktop_release_checksums.py \
            --output target/release/public-macos/SHA256SUMS.macos \
            target/release/public-macos/*.dmg \
            target/release/public-macos/*.tar.gz \
            target/release/public-macos/*.tar.gz.sig \
            target/release/public-macos/infergrade-runner-desktop-latest.json

      - name: Upload verified macOS release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infergrade-runner-desktop-macos-${{ github.sha }}
          if-no-files-found: error
          path: target/release/public-macos/
          retention-days: 7
          overwrite: true

  windows-package-smoke:
    name: Build and smoke Windows desktop packages
    needs: release-metadata
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      DESKTOP_VERSION: ${{ needs.release-metadata.outputs.desktop-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build unsigned Windows packages
        shell: bash
        run: |
          cd apps/desktop-runner
          npm ci
          npm run build:windows

      - name: Install and launch Windows packages
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/release/bundle/msi/*.msi -File
          $nsis = Get-ChildItem target/release/bundle/nsis/*.exe -File
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) { throw "Expected exactly one MSI and one NSIS package." }
          ./scripts/smoke_desktop_windows_packages.ps1 `
            -MsiPath $msi.FullName `
            -NsisPath $nsis.FullName `
            -ExpectedVersion $env:DESKTOP_VERSION

      - name: Prepare stable Windows preview assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/release/public-windows | Out-Null
          Copy-Item (Get-ChildItem target/release/bundle/msi/*.msi -File).FullName `
            target/release/public-windows/InferGrade.Runner.Windows-x64-UNSIGNED-PREVIEW.msi
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*.exe -File).FullName `
            target/release/public-windows/InferGrade.Runner.Windows-x64-UNSIGNED-PREVIEW.exe
          $checksumInputs = @(
            (Resolve-Path target/release/public-windows/InferGrade.Runner.Windows-x64-UNSIGNED-PREVIEW.msi).Path
            (Resolve-Path target/release/public-windows/InferGrade.Runner.Windows-x64-UNSIGNED-PREVIEW.exe).Path
          )
          python ./scripts/write_desktop_release_checksums.py `
            --output target/release/public-windows/SHA256SUMS.windows `
            @checksumInputs

      - name: Upload verified Windows package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infergrade-runner-desktop-windows-${{ github.sha }}
          if-no-files-found: error
          path: target/release/public-windows/
          retention-days: 7
          overwrite: true

  linux-package-smoke:
    name: Build and smoke Linux desktop packages
    needs: release-metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      DESKTOP_VERSION: ${{ needs.release-metadata.outputs.desktop-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri and launch-smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb \
            dbus-x11

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Set up build-time Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build Linux packages
        run: |
          cd apps/desktop-runner
          npm ci
          npm run build:linux

      - name: Install and launch Linux packages
        run: |
          deb=(target/release/bundle/deb/*.deb)
          appimage=(target/release/bundle/appimage/*.AppImage)
          test "${#deb[@]}" -eq 1
          test "${#appimage[@]}" -eq 1
          ./scripts/smoke_desktop_linux_packages.sh "${deb[0]}" "${appimage[0]}" "$DESKTOP_VERSION"

      - name: Prepare stable Linux assets
        run: |
          mkdir -p target/release/public-linux
          cp target/release/bundle/deb/*.deb target/release/public-linux/InferGrade.Runner.Linux-x86_64.deb
          cp target/release/bundle/appimage/*.AppImage target/release/public-linux/InferGrade.Runner.Linux-x86_64.AppImage
          python3 ./scripts/write_desktop_release_checksums.py \
            --output target/release/public-linux/SHA256SUMS.linux \
            target/release/public-linux/*.deb \
            target/release/public-linux/*.AppImage

      - name: Upload verified Linux package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infergrade-runner-desktop-linux-${{ github.sha }}
          if-no-files-found: error
          path: target/release/public-linux/
          retention-days: 7
          overwrite: true

  publish-release:
    name: Publish verified cross-platform release
    needs: [release-metadata, macos-preview, windows-package-smoke, linux-package-smoke]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    environment: release
    env:
      DESKTOP_VERSION: ${{ needs.release-metadata.outputs.desktop-version }}
      RELEASE_TAG: ${{ needs.release-metadata.outputs.release-tag }}
      RELEASE_NOTES: ${{ needs.release-metadata.outputs.release-notes }}
      PUBLISH_WINDOWS_PREVIEW: ${{ inputs.publish_unsigned_windows_preview }}
      PUBLIC_DMG_NAME: InferGrade.Runner.macOS-arm64.dmg
      PUBLIC_LINUX_DEB: InferGrade.Runner.Linux-x86_64.deb
      PUBLIC_LINUX_APPIMAGE: InferGrade.Runner.Linux-x86_64.AppImage
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified platform assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: infergrade-runner-desktop-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true

      - name: Assemble exact public asset set
        run: |
          checksum_parts=(release-assets/SHA256SUMS.macos release-assets/SHA256SUMS.linux)
          if [ "$PUBLISH_WINDOWS_PREVIEW" = "true" ]; then
            checksum_parts+=(release-assets/SHA256SUMS.windows)
          else
            rm -f release-assets/InferGrade.Runner.Windows-x64-UNSIGNED-PREVIEW.exe
            rm -f release-assets/InferGrade.Runner.Windows-x64-UNSIGNED-PREVIEW.msi
          fi
          cat "${checksum_parts[@]}" | sort -k2 > release-assets/SHA256SUMS
          rm -f release-assets/SHA256SUMS.macos release-assets/SHA256SUMS.linux release-assets/SHA256SUMS.windows
          test -f "release-assets/$PUBLIC_DMG_NAME"
          test -f "release-assets/$PUBLIC_LINUX_DEB"
          test -f "release-assets/$PUBLIC_LINUX_APPIMAGE"

      - name: Attest exact public release assets
        id: provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-assets/*

      - name: Verify release provenance policy
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          while IFS= read -r -d '' artifact; do
            gh attestation verify "$artifact" \
              --bundle "$ATTESTATION_BUNDLE" \
              --repo "${{ github.repository }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/desktop-runner-release.yml" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners
          done < <(find release-assets -maxdepth 1 -type f -print0)

      - name: Create or resume versioned draft release
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          test -n "$ATTESTATION_URL"
          printf '%s\n\n' "$RELEASE_NOTES" > "$notes_file"
          cat >> "$notes_file" <<EOF
          Platform status:
          - macOS arm64: Developer ID signed and notarized.
          - Linux x86_64: checksummed technical-beta packages; install and launch smoke passed in GitHub Actions.
          - Release assets: Sigstore-backed GitHub build provenance is available at $ATTESTATION_URL.
          EOF
          if [ "$PUBLISH_WINDOWS_PREVIEW" = "true" ]; then
            cat >> "$notes_file" <<'EOF'
          - Windows x64: UNSIGNED technical-preview installers; install and launch smoke passed, but Windows will show publisher/SmartScreen warnings. CUDA execution is not proven by hosted CI.
          EOF
          else
            cat >> "$notes_file" <<'EOF'
          - Windows x64: package install and launch smoke passed in CI; installers remain workflow artifacts until Authenticode signing is configured or unsigned preview publication is explicitly approved.
          EOF
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              echo "::error::$RELEASE_TAG is already published and immutable; refusing to replace its assets."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "InferGrade Runner $RELEASE_TAG" \
              --notes-file "$notes_file"
          fi
          gh release edit "$RELEASE_TAG" --title "InferGrade Runner $RELEASE_TAG" --notes-file "$notes_file"
          gh release upload "$RELEASE_TAG" release-assets/* --clobber

      - name: Reconcile desktop release asset set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected_assets="$RUNNER_TEMP/desktop-runner-expected-assets.txt"
          {
            awk -F '  ' '{print $2}' release-assets/SHA256SUMS
            echo SHA256SUMS
          } | sort -u > "$expected_assets"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset_name; do
            if ! grep -Fqx "$asset_name" "$expected_assets"; then
              gh release delete-asset "$RELEASE_TAG" "$asset_name" --yes
            fi
          done

      - name: Verify draft desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft_dir="$RUNNER_TEMP/desktop-runner-draft"
          mkdir -p "$draft_dir"
          gh release download "$RELEASE_TAG" --dir "$draft_dir"
          verify_args=(
            --directory "$draft_dir"
            --require-dmg
            --required-dmg-name "$PUBLIC_DMG_NAME"
            --require-updater
            --require-linux
            --reject-unexpected
          )
          if [ "$PUBLISH_WINDOWS_PREVIEW" = "true" ]; then
            verify_args+=(--require-windows-preview)
          fi
          python3 ./scripts/verify_desktop_release_artifacts.py "${verify_args[@]}"

      - name: Publish immutable versioned desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Verify published desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          immutable="$(gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" --jq '.immutable')"
          if [ "$immutable" != "true" ]; then
            echo "::error::$RELEASE_TAG published without GitHub release immutability."
            exit 1
          fi
          python3 ./scripts/verify_desktop_update_endpoint.py \
            --url "https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/infergrade-runner-desktop-latest.json" \
            --expected-version "$DESKTOP_VERSION"
          python3 ./scripts/verify_desktop_update_endpoint.py \
            --url "https://github.com/${{ github.repository }}/releases/latest/download/infergrade-runner-desktop-latest.json" \
            --expected-version "$DESKTOP_VERSION"
          published_dir="$RUNNER_TEMP/desktop-runner-published"
          mkdir -p "$published_dir"
          gh release download "$RELEASE_TAG" --dir "$published_dir"
          verify_args=(
            --directory "$published_dir"
            --require-dmg
            --required-dmg-name "$PUBLIC_DMG_NAME"
            --require-updater
            --require-linux
            --reject-unexpected
          )
          latest_assets=("$PUBLIC_DMG_NAME" "$PUBLIC_LINUX_DEB" "$PUBLIC_LINUX_APPIMAGE")
          if [ "$PUBLISH_WINDOWS_PREVIEW" = "true" ]; then
            verify_args+=(--require-windows-preview)
            latest_assets+=(
              InferGrade.Runner.Windows-x64-UNSIGNED-PREVIEW.exe
              InferGrade.Runner.Windows-x64-UNSIGNED-PREVIEW.msi
            )
          fi
          python3 ./scripts/verify_desktop_release_artifacts.py "${verify_args[@]}"
          verify_public_attestation() {
            local artifact="$1"
            local attempt
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$artifact" \
                --repo "${{ github.repository }}" \
                --signer-workflow "${{ github.repository }}/.github/workflows/desktop-runner-release.yml" \
                --source-ref refs/heads/main \
                --deny-self-hosted-runners; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }
          while IFS= read -r -d '' artifact; do
            verify_public_attestation "$artifact"
          done < <(find "$published_dir" -maxdepth 1 -type f -print0)
          for asset_name in "${latest_assets[@]}"; do
            downloaded="$RUNNER_TEMP/$asset_name"
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
              --output "$downloaded" \
              "https://github.com/${{ github.repository }}/releases/latest/download/$asset_name"
            expected_sha="$(awk -F '  ' -v name="$asset_name" '$2 == name {print $1}' release-assets/SHA256SUMS)"
            actual_sha="$(sha256sum "$downloaded" | awk '{print $1}')"
            test -n "$expected_sha"
            test "$actual_sha" = "$expected_sha"
          done
