name: Ubuntu 22 managed runtime and headless bundle
on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    paths:
      - '.github/workflows/ubuntu22-managed-runtime.yml'
      - 'scripts/build_linux_cuda_runtime.sh'
      - 'scripts/package_headless_runner.py'
      - 'scripts/install.sh'
permissions:
  contents: read
jobs:
  managed-cuda:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential cmake ninja-build curl ca-certificates python3 libssl-dev
      - name: Build pinned upstream source and smoke Ubuntu 22 loader
        shell: bash
        run: bash scripts/build_linux_cuda_runtime.sh output/ubuntu22-runtime
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ubuntu22-managed-cuda-${{ github.sha }}
          path: output/ubuntu22-runtime/
          if-no-files-found: error
          retention-days: 14
  headless:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - run: cargo build --locked --release -p infergrade-runner-cli
      - run: python3 scripts/package_headless_runner.py --cli target/release/infergrade-runner --output output/headless
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ubuntu22-headless-${{ github.sha }}
          path: output/headless/
          if-no-files-found: error
          retention-days: 14
