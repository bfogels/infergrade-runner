# cargo-deny configuration for infergrade-runner.
#
# Goal: keep `cargo deny check` blocking for *new* advisories while explicitly
# acknowledging the upstream Tauri/GTK3 transitive baseline so the OSS posture
# is honest. Re-evaluate every Tauri upgrade.

[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
  # Transitive proc-macro-error 1.x is unmaintained. Replacement requires
  # upstream tauri-plugin-* updates.
  { id = "RUSTSEC-2024-0370", reason = "transitive via Tauri plugin macros; revisit after Tauri 2.x minor bumps" },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []
skip = []

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "MIT-0",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OpenSSL",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
  "0BSD",
  "CDLA-Permissive-2.0",
  "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
